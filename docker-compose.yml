version: '3.8'

services:
  # Oficina HP Frontend
  oficina-hp:
    build: .
    container_name: oficina_hp_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - pocketbase

  # PocketBase Backend & Realtime Database
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: oficina_hp_pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Ollama Server for Local AI Vision (llama3.2-vision)
  ollama:
    image: ollama/ollama:latest
    container_name: oficina_hp_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pb_data:
  ollama_data:
